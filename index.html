<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="EstiMeow – purrfect estimates for agile teams. Planning-Poker-Schätzungen im Team: kostenlos, ohne Anmeldung, in Echtzeit." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
    <title>EstiMeow – purrfect estimates for agile teams</title>
    <script>
      // Gespeichertes Farbschema vor dem ersten Paint setzen, damit nichts aufblitzt.
      (function () {
        try {
          var theme = localStorage.getItem('sr-theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
